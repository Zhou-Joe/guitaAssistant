name: GuitarAssistant
options:
  bundleIdPrefix: com.guitarassistant
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: NO
    INFOPLIST_FILE: GuitarAssistant/Info.plist
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

targets:
  GuitarAssistant:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: GuitarAssistant/Sources
      - path: GuitarAssistant/Resources
        buildPhase: resources
    resources: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.guitarassistant.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"

  GuitarAssistantUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: GuitarAssistantUITests
    dependencies:
      - target: GuitarAssistant
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.guitarassistant.app.uitests
